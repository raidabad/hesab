name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -Djava.awt.headless=true' -Djava.awt.headless=true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Configuration & Keystore
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          touch .env .env.example
          
          # إعدادات لمنع خطأ AWT في KSP والمترجم
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true
          ksp.incremental=false
          ksp.use.ksp2=false
          kotlin.daemon.jvmargs=-Djava.awt.headless=true -Xmx2048m
          EOF

          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp app/debug.keystore ./debug.keystore

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache -Djava.awt.headless=true -x test -x lint -x check --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccountingApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
